<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>PDF Viewer</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css">
  <link rel="stylesheet" href="style.css?v=4ad3efc9">
</head>
<body>
  <header id="toolbar">
    <div class="grp">
      <button id="sidebarToggle" class="icon" title="목차" hidden>☰</button>
      <span id="title">PDF</span>
    </div>

    <div class="grp">
      <button id="prev" class="icon" title="이전 페이지 (←)">‹</button>
      <input id="pageNum" type="text" inputmode="numeric" value="1" aria-label="페이지 번호">
      <span id="pageCount">/ –</span>
      <button id="next" class="icon" title="다음 페이지 (→)">›</button>
    </div>

    <div class="grp">
      <button id="zoomOut" class="icon" title="축소 (Ctrl -)">−</button>
      <select id="zoomSelect" aria-label="배율">
        <option value="auto">자동</option>
        <option value="page-width">페이지 너비</option>
        <option value="page-fit">페이지 맞춤</option>
        <option value="0.5">50%</option>
        <option value="0.75">75%</option>
        <option value="1">100%</option>
        <option value="1.25">125%</option>
        <option value="1.5">150%</option>
        <option value="2">200%</option>
        <option value="3">300%</option>
        <option id="customZoom" value="custom" hidden></option>
      </select>
      <button id="zoomIn" class="icon" title="확대 (Ctrl +)">+</button>
    </div>

    <div class="grp search">
      <input id="findInput" type="search" placeholder="검색 (Ctrl F)" aria-label="검색">
      <button id="findPrev" class="icon" title="이전 결과 (Shift Enter)">↑</button>
      <button id="findNext" class="icon" title="다음 결과 (Enter)">↓</button>
      <span id="findMsg"></span>
    </div>

    <div class="grp">
      <button id="dl" disabled>다운로드</button>
    </div>
  </header>

  <aside id="sidebar" hidden>
    <div id="outline"></div>
  </aside>

  <div id="viewerContainer">
    <div id="viewer" class="pdfViewer"></div>
  </div>

  <p id="msg">불러오는 중…</p>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="app.js?v=f90b8978"></script>
</body>
</html>
